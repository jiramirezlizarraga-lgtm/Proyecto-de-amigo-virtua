<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp - Valeria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <!-- Cabecera estilo WhatsApp -->
        <header class="chat-header">
            <div class="avatar-container">
                <div class="avatar">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="Valeria">
                </div>
            </div>
            <div class="header-info">
                <h1>Valeria</h1>
                <p id="headerStatus">en línea</p>
            </div>
        </header>

        <!-- Zona de mensajes -->
        <div class="chat-messages" id="chatMessages">
            <div class="message valeria">
                ¡Hola! Qué gusto saludarte por aquí. 😊 ¿Cómo va tu día? Cuéntame qué has hecho o de qué te gustaría platicar hoy. ✨
            </div>
        </div>

        <!-- Indicador de escritura -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-bubble">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <!-- Panel de Emojis -->
        <div class="emoji-picker" id="emojiPicker" style="display: none;">
            <button type="button" class="emoji-btn">😊</button>
            <button type="button" class="emoji-btn">😂</button>
            <button type="button" class="emoji-btn">🥰</button>
            <button type="button" class="emoji-btn">😎</button>
            <button type="button" class="emoji-btn">👍</button>
            <button type="button" class="emoji-btn">❤️</button>
            <button type="button" class="emoji-btn">🔥</button>
            <button type="button" class="emoji-btn">🏎️</button>
            <button type="button" class="emoji-btn">🫂</button>
            <button type="button" class="emoji-btn">✨</button>
            <button type="button" class="emoji-btn">🤔</button>
            <button type="button" class="emoji-btn">😢</button>
        </div>

        <!-- Barra inferior estilo WhatsApp -->
        <div class="chat-input-area">
            <button id="emojiToggleBtn" aria-label="Emojis" title="Emojis">😊</button>
            
            <!-- Input para fotos: en PC abre archivos/galería, en celular pregunta si deseas usar la Cámara o la Galería -->
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
            <button id="attachBtn" aria-label="Adjuntar foto o usar cámara" title="Enviar foto o tomar selfie">📷</button>

            <input type="text" id="userInput" placeholder="Escribe un mensaje..." autocomplete="off">

            <!-- Botón para grabar audio o enviar -->
            <button id="micBtn" aria-label="Enviar nota de voz" title="Grabar audio">🎤</button>
            <button id="sendButton" aria-label="Enviar mensaje" style="display: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
